name: Unit test coverage

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.github/workflows/code-coverage.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.github/workflows/code-coverage.yml'

jobs:
  coverage:
    if: github.repository == 'laravel-notification-channels/telegram'
    runs-on: ubuntu-latest

    env:
      COMPOSER_CACHE_DIR: ~/.composer/cache
      LARAVEL_VERSION: '12.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: pcov
          extensions: mbstring, curl, fileinfo
          ini-values: memory_limit=-1

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-coverage-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer require laravel/framework:${{ env.LARAVEL_VERSION }} --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Execute tests with coverage
        run: vendor/bin/pest --coverage --coverage-clover=build/pest.xml --min=100

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/pest.xml
          verbose: true
