name: Mutation tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/mutation.yml'
  pull_request:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSER_CACHE_DIR: ~/.composer/cache
      LARAVEL_VERSION: '13.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: pcov
          extensions: mbstring, curl, fileinfo
          ini-values: memory_limit=-1

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: composer-${{ runner.os }}-mutation-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer require laravel/framework:${{ env.LARAVEL_VERSION }} --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      # --parallel is deliberately NOT used: parallel runs lose the
      # mutant-to-covering-test mapping and report covered mutants as
      # "untested" (score drops to ~89% with identical code and tests).
      - name: Run mutation tests
        run: vendor/bin/pest --mutate --everything --covered-only --min=100
